name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js 20 설정 ───────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. 의존성 설치 ────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Create .env files
        run: |
          # 루트 폴더용 .env 생성
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ALADIN_API_KEY=${{ secrets.VITE_ALADIN_API_KEY }}
          VITE_GOOGLE_MAPS_KEY=${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_LIBRARY_API_KEY=${{ secrets.VITE_LIBRARY_API_KEY }}
          EOF

          # client 폴더용 .env 생성
          cat > client/.env << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ALADIN_API_KEY=${{ secrets.VITE_ALADIN_API_KEY }}
          VITE_GOOGLE_MAPS_KEY=${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_LIBRARY_API_KEY=${{ secrets.VITE_LIBRARY_API_KEY }}
          EOF

      # ── 4. 빌드 ──────────────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── 5. Docker 이미지 빌드 ─────────────────────────────────────────────────
      - name: Build Docker image
        run: docker build -t booklog:latest .

      # ── 6. Docker 이미지 tar 저장 ─────────────────────────────────────────────
      - name: Save Docker image
        run: docker save booklog:latest > booklog.tar

      # ── 7. EC2에 SSH 키 설정 + tar 파일 SCP 전송 ─────────────────────────────
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

      - name: SCP image to EC2
        run: |
          scp -i /tmp/ec2_key \
            -o StrictHostKeyChecking=no \
            booklog.tar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/

      # ── 8. EC2 SSH 접속 → 이미지 로드 + 컨테이너 교체 ───────────────────────
      - name: Deploy on EC2
        run: |
          ssh -i /tmp/ec2_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
              set -e

              echo "▶ Docker 이미지 로드"
              docker load < /home/ubuntu/booklog.tar

              echo "▶ 기존 컨테이너 중지 및 삭제"
              docker stop booklog 2>/dev/null || true
              docker rm   booklog 2>/dev/null || true

              echo "▶ 새 컨테이너 실행 (포트 80:80)"
              docker run -d \
                --name booklog \
                --restart always \
                -p 80:80 \
                booklog:latest

              echo "▶ 이전 이미지 정리"
              docker image prune -f

              echo "✅ 배포 완료"
            '

      # ── 정리: SSH 키 삭제 ────────────────────────────────────────────────────
      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/ec2_key
