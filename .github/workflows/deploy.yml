name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      # 요청하신 AWS 환경 설정 추가
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_EC2_METADATA_DISABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t booklog:latest .

      - name: Save Docker image
        run: docker save booklog:latest > booklog.tar

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

      # 환경변수(env)를 사용하여 명령어를 단순화했습니다.
      - name: SCP image to EC2
        run: |
          scp -i /tmp/ec2_key \
            -o StrictHostKeyChecking=no \
            booklog.tar \
            $EC2_USER@$EC2_HOST:/home/ubuntu/

      - name: Debug SSH Connection
        run: |
          ssh -i /tmp/ec2_key \
            -o StrictHostKeyChecking=no \
            -v \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'echo "Login Success"'

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/ec2_key
